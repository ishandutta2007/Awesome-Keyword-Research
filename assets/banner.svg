<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #cbd5e1;
      letter-spacing: 1px;
    }
    .tag {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 2px;
    }
    .wave {
      animation: waveMove 6s ease-in-out infinite alternate;
    }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 1; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic Decorative Chart Bars in Background -->
  <g opacity="0.25">
    <rect x="800" y="160" width="28" height="90" rx="4" fill="url(#barGrad)"/>
    <rect x="840" y="120" width="28" height="130" rx="4" fill="url(#barGrad)"/>
    <rect x="880" y="180" width="28" height="70" rx="4" fill="url(#barGrad)"/>
    <rect x="920" y="90" width="28" height="160" rx="4" fill="url(#barGrad)"/>
    <rect x="960" y="140" width="28" height="110" rx="4" fill="url(#barGrad)"/>
    <rect x="1000" y="70" width="28" height="180" rx="4" fill="url(#barGrad)"/>
    <rect x="1040" y="110" width="28" height="140" rx="4" fill="url(#barGrad)"/>
    <rect x="1080" y="50" width="28" height="200" rx="4" fill="url(#barGrad)"/>
  </g>

  <!-- Dynamic Glowing Polyline (Search Volume Trend line) -->
  <path d="M 800 200 Q 860 140 920 110 T 1040 80 L 1110 50" fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" opacity="0.7"/>
  <path d="M 800 200 Q 860 140 920 110 T 1040 80 L 1110 50" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.9"/>
  
  <circle cx="1110" cy="50" r="6" fill="#38bdf8" class="pulse-dot" />

  <!-- Abstract Keyword Search Nodes -->
  <g opacity="0.3">
    <circle cx="150" cy="60" r="30" fill="none" stroke="#818cf8" stroke-width="2"/>
    <circle cx="100" cy="220" r="45" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="650" cy="50" r="20" fill="none" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Foreground Content (Guaranteed on top) -->
  <g transform="translate(70, 0)">
    <!-- Category Tag -->
    <text x="0" y="85" class="tag">🔍 SEO &amp; SEARCH INTEL PLATFORM</text>
    
    <!-- Main Title -->
    <text x="0" y="150" class="title" filter="url(#glow)">Awesome Keyword Research</text>
    
    <!-- Subtitle -->
    <text x="0" y="200" class="subtitle">Curated SaaS Tools, Open-Source Libraries &amp; Search Volume Scrapers</text>
    
    <!-- Feature Pill Badges in Banner -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
      <text x="65" y="18" font-family="sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="bold">✨ SaaS Pricing</text>
      
      <rect x="142" y="0" width="150" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
      <text x="217" y="18" font-family="sans-serif" font-size="12" fill="#a855f7" text-anchor="middle" font-weight="bold">⚡ GitHub Projects</text>

      <rect x="304" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
      <text x="374" y="18" font-family="sans-serif" font-size="12" fill="#4ade80" text-anchor="middle" font-weight="bold">📈 SERP Analytics</text>
    </g>
  </g>
</svg>
